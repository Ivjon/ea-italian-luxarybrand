<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>EA Luxury CRM</title><link rel="stylesheet" href="/admin/admin.css"><link rel="icon" href="/assets/brand/ea-icon.png"></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11 12 3.5l8.5 7.5M6 9v11.5h4.5v-6h3v6H18V9"/></symbol>
  <symbol id="i-dashboard" viewBox="0 0 24 24"><path d="M3.5 3.5h7v8h-7zM13.5 3.5h7v5h-7zM13.5 11.5h7v9h-7zM3.5 14.5h7v6h-7z"/></symbol>
  <symbol id="i-orders" viewBox="0 0 24 24"><path d="M5 7.5h14l-1 13H6zM9 7.5V6a3 3 0 0 1 6 0v1.5"/></symbol>
  <symbol id="i-products" viewBox="0 0 24 24"><path d="M8.5 3.5 4 6.5l2 4 2-1v11h8v-11l2 1 2-4-4.5-3c-.6 1.6-2 2.5-3.5 2.5S9.1 5.1 8.5 3.5z"/></symbol>
  <symbol id="i-customers" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-4 3.8-6 7.5-6s6.7 2 7.5 6"/></symbol>
  <symbol id="i-leads" viewBox="0 0 24 24"><path d="M3.5 5.5h17l-6.5 7.5v6l-4 2v-8z"/></symbol>
  <symbol id="i-inventory" viewBox="0 0 24 24"><path d="M3.5 7.5 12 3.5l8.5 4v9L12 20.5l-8.5-4zM3.5 7.5 12 11.5l8.5-4M12 11.5v9"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3 21 21"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M14.5 4.5h5v15h-5M10 8l-4 4 4 4M6 12h10"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8 19.5 3.5M16 7l2.5 2.5M14 9l2 2"/></symbol>
  <symbol id="i-store" viewBox="0 0 24 24"><path d="M14 4.5h5.5V10M19.5 4.5 11 13M10 6.5H4.5v13h13V14"/></symbol>
</svg>
<div class="app-shell">
  <aside class="sidebar">
    <button class="brand" type="button" data-view="dashboard" title="Start page"><img src="/assets/brand/ea-logo-dark.svg" alt="EA Luxury Italian Brand"></button>
    <nav aria-label="CRM">
      <div class="nav-group"><p class="nav-label">Overview</p><button class="nav-item" data-view="home" title="Home" hidden><svg aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></button><button class="nav-item" data-view="dashboard" title="Dashboard"><svg aria-hidden="true"><use href="#i-dashboard"/></svg><span>Dashboard</span></button></div>
      <div class="nav-group"><p class="nav-label">Sales</p><button class="nav-item" data-view="orders" title="Orders"><svg aria-hidden="true"><use href="#i-orders"/></svg><span>Orders</span><b id="orderBadge" title="Orders to ship">0</b></button></div>
      <div class="nav-group"><p class="nav-label">Products</p><button class="nav-item" data-view="products" title="Products"><svg aria-hidden="true"><use href="#i-products"/></svg><span>Products</span></button><button class="nav-item" data-view="inventory" title="Inventory"><svg aria-hidden="true"><use href="#i-inventory"/></svg><span>Inventory</span></button></div>
      <div class="nav-group"><p class="nav-label">Marketing</p><button class="nav-item" data-view="customers" title="Customers"><svg aria-hidden="true"><use href="#i-customers"/></svg><span>Customers</span></button><button class="nav-item" data-view="leads" title="Leads"><svg aria-hidden="true"><use href="#i-leads"/></svg><span>Leads</span></button></div>
    </nav>
    <a class="view-store" href="/" target="_blank" rel="noopener" title="View store"><svg aria-hidden="true"><use href="#i-store"/></svg><span>View store</span></a>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="search-box"><svg aria-hidden="true"><use href="#i-search"/></svg><label class="vh" for="globalSearch">Search the CRM</label><input id="globalSearch" type="search" placeholder="Search orders, products, customers…" autocomplete="off"></div>
      <div class="user">
        <button class="icon-btn" id="alertsBtn" aria-label="Needs attention"><svg aria-hidden="true"><use href="#i-bell"/></svg><b id="alertCount" hidden>0</b></button>
        <div class="avatar" id="avatar" aria-hidden="true">EA</div>
        <div class="user-name"><b id="userName">Admin</b><small id="userRole"></small></div>
        <button class="icon-btn" id="changePassword" aria-label="Change password" title="Change password"><svg aria-hidden="true"><use href="#i-key"/></svg></button>
        <button class="icon-btn" id="signOut" aria-label="Sign out" title="Sign out"><svg aria-hidden="true"><use href="#i-out"/></svg></button>
      </div>
    </header>
    <section class="content" id="viewRoot" aria-live="polite"><p class="loading">Loading the CRM…</p></section>
  </main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-card"><button class="modal-close" id="modalClose" aria-label="Close">×</button><div id="modalBody"></div></div></div>
<p class="toast" id="toast" role="status"></p>
<script src="/catalog.js" defer></script>
<script src="/admin/admin.js" defer></script>
</body>
</html>
