<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sign in · EA Luxury CRM</title>
  <link rel="stylesheet" href="/admin/admin.css" />
  <link rel="icon" href="/assets/brand/ea-icon.png" />
</head>
<body class="login-page">
  <main class="login">
    <form class="login-card" id="loginForm" novalidate>
      <img class="login-logo" src="/assets/brand/ea-logo-dark.svg" alt="EA Luxury Italian Brand" width="88" height="70" />
      <h1>Sign in to the CRM</h1>
      <p class="login-lead">Orders, products, customers and stock for the EA Luxury store.</p>
      <label for="username">Username or email</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="254" />
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" />
        <button type="button" class="show-password" id="showPassword" aria-pressed="false">Show</button>
      </div>
      <p class="form-error" id="loginError" role="alert"></p>
      <button class="login-submit" id="loginSubmit">Sign in</button>
      <a class="login-back" href="/">← Back to the store</a>
    </form>
  </main>
  <script src="/admin/login.js" defer></script>
</body>
</html>
